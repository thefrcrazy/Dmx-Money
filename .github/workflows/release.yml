name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "DmxMoney ${{ github.ref_name }}" \
            --notes "Voir le [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) pour les détails." \
            --draft=true \
            --prerelease=false || echo "Release already exists"

  build-and-upload:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-15' # Apple Silicon (M1/M2/M3)
            args: '--target aarch64-apple-darwin'
            arch: 'aarch64'
            os_name: 'darwin'
            rust_target: 'aarch64-apple-darwin'
          - platform: 'macos-15-intel' # Intel Mac
            args: '--target x86_64-apple-darwin'
            arch: 'x64'
            os_name: 'darwin'
            rust_target: 'x86_64-apple-darwin'
          - platform: 'windows-2025-vs2026'
            args: ''
            arch: 'x64'
            os_name: 'windows'
            rust_target: ''
          - platform: 'ubuntu-22.04'
            args: ''
            arch: 'x64'
            os_name: 'linux'
            rust_target: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libjavascriptcoregtk-4.1-dev zip

      - name: Install Frontend dependencies
        run: bun install --frozen-lockfile

      - name: Switch Tailwind Mode
        run: |
          chmod +x ./switch-tailwind.sh
          if [ "${{ matrix.arch }}" == "x64" ] && [ "${{ matrix.os_name }}" == "darwin" ]; then
            ./switch-tailwind.sh legacy
          else
            ./switch-tailwind.sh modern
          fi
        shell: bash

      - name: Configure Intel macOS deployment target
        if: matrix.arch == 'x64' && matrix.os_name == 'darwin'
        run: echo "MACOSX_DEPLOYMENT_TARGET=10.15" >> "$GITHUB_ENV"

      # Build sans release automatique mais avec les clés pour générer les bundles d'update
      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          includeUpdaterJson: false
          args: ${{ matrix.args }}

      # Gestion manuelle des assets et signature
      - name: Process and Upload Assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SIGNING_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ARCH: ${{ matrix.arch }}
          OS_NAME: ${{ matrix.os_name }}
          VERSION: ${{ github.ref_name }} # e.g. v0.1.7
        run: |
          echo "🔍 Finding assets..."
          CLEAN_VERSION="${VERSION#v}"
          BUNDLE_DIR=$(find src-tauri/target -type d -name "bundle" | head -n 1)
          
          if [ -z "$BUNDLE_DIR" ]; then
            echo "❌ Bundle directory not found"
            exit 1
          fi

          case "$OS_NAME" in
            windows)
              # Use the signed NSIS setup directly for Tauri v2 updates.
              # This avoids the fragile MSI zip extraction path on Windows.
              UPDATE_BUNDLE=$(find "$BUNDLE_DIR/nsis" -type f -name "*.exe" ! -name "*.sig" | head -n 1)
              NEW_BUNDLE_NAME="DmxMoney_${CLEAN_VERSION}_${ARCH}_${OS_NAME}_setup.exe"
              ;;
            darwin)
              UPDATE_BUNDLE=$(find "$BUNDLE_DIR" -type f -name "*.app.tar.gz" ! -name "*.sig" | head -n 1)
              NEW_BUNDLE_NAME="DmxMoney_${CLEAN_VERSION}_${ARCH}_${OS_NAME}.app.tar.gz"
              ;;
            linux)
              UPDATE_BUNDLE=$(find "$BUNDLE_DIR" -type f -name "*.AppImage" ! -name "*.sig" | head -n 1)
              NEW_BUNDLE_NAME="DmxMoney_${CLEAN_VERSION}_${ARCH}_${OS_NAME}.AppImage"
              ;;
            *)
              echo "❌ Unsupported OS_NAME: $OS_NAME"
              exit 1
              ;;
          esac

          if [ -z "$UPDATE_BUNDLE" ]; then
            echo "❌ Updater bundle not found for $OS_NAME/$ARCH"
            find "$BUNDLE_DIR" -type f
            exit 1
          fi

          cp "$UPDATE_BUNDLE" "./$NEW_BUNDLE_NAME"

          export TAURI_SIGNING_PRIVATE_KEY="$SIGNING_KEY"
          export TAURI_SIGNING_PRIVATE_KEY_PASSWORD="$SIGNING_KEY_PASSWORD"
          bun tauri signer sign "./$NEW_BUNDLE_NAME"

          gh release upload "$VERSION" "./$NEW_BUNDLE_NAME" "./$NEW_BUNDLE_NAME.sig" --clobber

          find "$BUNDLE_DIR" -type f \( -name "*.dmg" -o -name "*.exe" -o -name "*.msi" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" \) ! -path "*/deps/*" | while read -r INSTALLER_PATH; do
            if [ "$INSTALLER_PATH" = "$UPDATE_BUNDLE" ]; then
              continue
            fi
            INST_NAME=$(basename "$INSTALLER_PATH")
            EXT="${INST_NAME##*.}"
            if [[ "$INST_NAME" == *setup*.exe ]]; then
              NEW_INST_NAME="DmxMoney_${CLEAN_VERSION}_${ARCH}_${OS_NAME}_setup.exe"
            else
              NEW_INST_NAME="DmxMoney_${CLEAN_VERSION}_${ARCH}_${OS_NAME}.${EXT}"
            fi
            cp "$INSTALLER_PATH" "./$NEW_INST_NAME"
            gh release upload "$VERSION" "./$NEW_INST_NAME" --clobber
          done

  generate-updater-json:
    needs: build-and-upload
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Generate latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.ref_name }}"
          CLEAN_VERSION="${VERSION#v}"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          REPO="${{ github.repository }}"
          BASE_URL="https://github.com/$REPO/releases/download/$VERSION"
          ASSETS=$(gh release view "$VERSION" --repo "$REPO" --json assets -q '.assets[].name')
          PLATFORMS="{}"

          add_platform() {
            local platform_key="$1"
            local pattern="$2"
            ASSET_NAME=$(echo "$ASSETS" | grep -iE "$pattern" | grep -v '\.sig$' | head -n 1)
            if [ -n "$ASSET_NAME" ]; then
              gh release download "$VERSION" --repo "$REPO" -p "${ASSET_NAME}.sig" -D /tmp --clobber
              SIGNATURE=$(cat "/tmp/${ASSET_NAME}.sig")
              PLATFORMS=$(echo "$PLATFORMS" | jq --arg key "$platform_key" --arg sig "$SIGNATURE" --arg url "$BASE_URL/$ASSET_NAME" '. + {($key): {"signature": $sig, "url": $url}}')
            fi
          }

          add_platform "darwin-aarch64" "aarch64.*darwin.*app\.tar\.gz"
          add_platform "darwin-x86_64"  "x64.*darwin.*app\.tar\.gz"
          add_platform "windows-x86_64" "x64.*windows.*setup\.exe"
          add_platform "linux-x86_64"   "x64.*linux.*AppImage"

          jq -n --arg version "$CLEAN_VERSION" --arg notes "Mise à jour $CLEAN_VERSION" --arg pub_date "$PUB_DATE" --argjson platforms "$PLATFORMS" '{version: $version, notes: $notes, pub_date: $pub_date, platforms: $platforms}' > latest.json
          gh release upload "$VERSION" latest.json --repo "$REPO" --clobber
          gh release edit "$VERSION" --draft=false --repo "$REPO"

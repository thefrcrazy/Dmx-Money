name = "dmxmoney-managed-bridge"
main = "src/index.ts"
compatibility_date = "2026-05-27"

kv_namespaces = [
  { binding = "DEVICES", id = "replace-with-production-devices-kv-id" },
  { binding = "ASSETS", id = "replace-with-production-assets-kv-id" }
]

[vars]
BRIDGE_DOMAIN = "develop-max.com"
PWA_URL = "https://dmxmoney.develop-max.com/mobile"
DEVICE_PREFIX = "dmx"
REGISTRATION_LIMIT_PER_HOUR = "20"

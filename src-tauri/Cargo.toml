[package]
name = "app"
version = "1.0.9"
description = "DmxMoney"
authors = ["Maxim Collignon"]
license = "MIT"
repository = "https://github.com/thefrcrazy/Dmx-Money"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
tauri = { version = "2.11", features = ["devtools"] }
tauri-plugin-log = "2.8"
tauri-plugin-fs = "2.5"
tauri-plugin-os = "2.3"
tauri-plugin-dialog = "2.7"
tauri-plugin-updater = "2.10"
tauri-plugin-process = "2.3"
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
uuid = { version = "1.23", features = ["v4"] }
reqwest = { version = "0.13", features = ["json", "query"] }
keyring = "3.6"
sha2 = "0.10"
url = "2.5"
subtle = "2.6"
passkey-auth = "0.1.3"
rustls = "0.23"
rustls-pemfile = "2.2"
instant-acme = "0.7"
rcgen = "0.14"
